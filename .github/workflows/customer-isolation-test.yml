name: Customer isolation test

on:
  push:
    branches:
      - main
      - customer-isolation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check bridge/server.mjs
          node --check bridge/server-v2.mjs
          node --check bridge/connection-state.mjs
          node --check bridge/oauth-state.mjs
          node --check bridge/workspace-runtime.mjs
          node --check bridge/isolation-test.mjs
          node --check bridge/credential-rotation-test.mjs
          node --check bridge/legacy-owner-retirement-test.mjs
          node --check bridge/private-oauth-reconnect-test.mjs
          node --check bridge/rotate-master-token.mjs
          node --check bridge-onboarding.js
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw 'bridge/windows/start-bridge.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw 'bridge/windows/install-autostart.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw 'bridge/windows/show-access-code.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw 'bridge/windows/rotate-master-token.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw 'bridge/windows/disable-legacy-owner.ps1'))
      - name: Run two-customer isolation regression
        run: node bridge/isolation-test.mjs
      - name: Run credential rotation regression
        run: node bridge/credential-rotation-test.mjs
      - name: Run legacy owner retirement regression
        run: node bridge/legacy-owner-retirement-test.mjs
      - name: Run private OAuth reconnect regression
        run: node bridge/private-oauth-reconnect-test.mjs
